{% extends "base.html" %}


{% block content %}
    <main class="flex min-h-screen items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">

            <!-- Logo -->
            <div class="mb-8 text-center">

                <a href="{{ url_for('inicio') }}" class="text-xl font-bold tracking-tight">
                    ShowCase
                </a>

            </div>


            <!-- Card de confirmação -->
            <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm sm:p-8">

                <!-- Ícone -->
                <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-50">

                    <svg class="h-8 w-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        aria-hidden="true">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-9 0h14" />

                    </svg>

                </div>


                <!-- Título -->
                <h1 class="mt-6 text-2xl font-bold tracking-tight">
                    Excluir projeto?
                </h1>


                <!-- Descrição -->
                <p class="mt-3 text-sm leading-6 text-slate-600">

                    Tem certeza que desejas excluir

                    <span class="font-semibold text-slate-900">
                        {{ project.name }}
                    </span>?

                </p>


                <p class="mt-2 text-xs text-slate-500">
                    Esta ação não pode ser desfeita.
                </p>


                <!-- Botões -->
                <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">

                    <!-- Cancelar -->
                    <a href="{{ url_for('projects.user_projects', id=current_user.id) }}"
                        class="w-full rounded-lg border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 sm:w-auto">

                        Cancelar

                    </a>


                    <!-- Confirmar -->
                    <form action="{{ url_for('projects.delete_project', id=project.id) }}" method="POST"
                        class="w-full sm:w-auto">

                        <button type="submit"
                            class="w-full rounded-lg bg-red-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-200 focus:ring-offset-2 sm:w-auto">

                            Sim, excluir

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </main>

{% endblock %}
