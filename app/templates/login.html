<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form method="POST">

        <input type="email" name="email" placeholder="Email">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">
            Entrar
        </button>

        <p>Não tem conta?</p>
        <a href="{{ url_for('user.register') }}">Register</a>

    </form>

</body>

</html>
