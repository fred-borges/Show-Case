
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if title %}
        {{ title }} | ShowCase
        {% else %}
        ShowCase
        {% endif %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <header class="border-b border-slate-200 bg-white">

        <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">

            <!-- Logo -->
            <a href="{{ url_for('inicio') }}" class="text-xl font-bold tracking-tight text-slate-900">
                ShowCase
            </a>


            <!-- Navegação -->
            <div class="flex items-center gap-3 sm:gap-6">

                <a href="{{ url_for('inicio') }}"
                    class="text-sm font-medium text-slate-600 transition hover:text-slate-900">
                    Início
                </a>


                {% if current_user.is_authenticated %}

                <a href="{{ url_for('projects.project') }}"
                    class="hidden text-sm font-medium text-slate-600 transition hover:text-slate-900 sm:block">
                    Publicar
                </a>

                <a href="{{ url_for('projects.user_projects', id=current_user.id) }}"
                    class="hidden text-sm font-medium text-slate-600 transition hover:text-slate-900 sm:block">
                    Meus projetos
                </a>

                <a href="{{ url_for('user.logout') }}"
                    class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                    Sair
                </a>

                {% else %}

                <a href="{{ url_for('user.login') }}"
                    class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700">
                    Entrar
                </a>

                {% endif %}

            </div>

        </nav>

    </header>


    <!-- Conteúdo das páginas -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="mt-12 border-t border-slate-200 bg-white">

        <div class="mx-auto max-w-6xl px-4 py-6 text-center text-sm text-slate-500 sm:px-6 lg:px-8">
            © 2026 ShowCase
        </div>

    </footer>

</body>

</html>
